schema_version: 1
modality: xray
beam:
  i0: 1
  step_mm: 0.5
geometry:
  source_to_detector_mm: 1020
  source_to_isocenter_mm: 510
detector:
  width_px: 512
  height_px: 512
  pixel_spacing_mm: 0.5
post_processing:
  realism:
    enabled: false
    gain: 1
    bias: 0
    poisson_photons: 0
    gaussian_sigma: 0
    blur_sigma_px: 0
    seed: 0
  display:
    polarity: diagnostic
    scaling: log
    log_window:
    - 0
    - 6
    window:
    - 0
    - 1
    gamma: 1
preprocessing:
  clip_hu: true
  hu_clip_min: -1024
  hu_clip_max: 3071
  hu_to_mu:
    hu_min: -1000
    hu_max: 3000
    mu_min: 0
    mu_max: 0.02
output:
  format: npy
  keep_intensity: true
